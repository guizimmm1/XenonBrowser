
name: Build Xbox 360 SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xsdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Clone Xbox 360 SDK
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Build Xenon toolchain
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" \
          WORK="$HOME/xsdk-gcc-work" \
          JOBS=2 \
          bash tools/toolchain/build.sh

      - name: Build SDK
        run: |
          cd "$HOME/xsdk"
          make -j2 TOOLCHAIN="$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-"

      - name: Verify compiler and sockets
        run: |
          "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" --version
          test -f "$HOME/xsdk/build/libxsdk.a"
          test -f "$HOME/xsdk/src/xsdk.ld"
          grep -nE 'socket|bind|listen|accept' \
            "$HOME/xsdk/include/sys/socket.h"

      - name: Prepare SDK artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sdk-artifact"
          cp -a "$HOME/xsdk-gcc" "$GITHUB_WORKSPACE/sdk-artifact/"
          cp -a "$HOME/xsdk/build/libxsdk.a" "$GITHUB_WORKSPACE/sdk-artifact/"
          cp -a "$HOME/xsdk/src/xsdk.ld" "$GITHUB_WORKSPACE/sdk-artifact/"
          cp -a "$HOME/xsdk/include" "$GITHUB_WORKSPACE/sdk-artifact/"

      - name: Upload SDK build
        uses: actions/upload-artifact@v4
        with:
          name: xenon-sdk-build
          path: sdk-artifact/
          if-no-files-found: error
          retention-days: 7
          
