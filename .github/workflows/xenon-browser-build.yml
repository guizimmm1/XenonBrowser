name: Build Xenon Browser for Xbox 360

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Xenon Browser
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cmake ninja-build \
            flex bison python3 python3-pip \
            curl wget unzip zip xz-utils \
            pkg-config autoconf automake libtool gperf \
            libgmp-dev libmpfr-dev libmpc-dev

      - name: Download previously built Xbox SDK
        uses: actions/download-artifact@v4
        with:
          name: xenon-sdk-build
          run-id: 45056701853
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/xsdk-sdk

      - name: Prepare SDK source and compiled files
        shell: bash
        run: |
          set -euo pipefail

          SHA=9e6de98f6b5d737bce0fecd2864edae94bdd2637
          XSDK="$GITHUB_WORKSPACE/third_party/xsdk"

          git clone https://github.com/xenosworks/xsdk.git "$XSDK"
          git -C "$XSDK" fetch --depth 1 origin "$SHA"
          git -C "$XSDK" checkout --detach FETCH_HEAD

          mkdir -p "$XSDK/build" "$XSDK/src"
          cp "$RUNNER_TEMP/xsdk-sdk/libxsdk.a" "$XSDK/build/"
          cp "$RUNNER_TEMP/xsdk-sdk/xsdk.ld" "$XSDK/src/"
          cp -a "$RUNNER_TEMP/xsdk-sdk/include/." "$XSDK/include/"

          cp -a "$RUNNER_TEMP/xsdk-sdk/xsdk-gcc" "$HOME/"
          chmod -R a+rx "$HOME/xsdk-gcc/bin" "$HOME/xsdk-gcc/libexec"

          # Force GCC to use the XSDK PowerPC binutils
          test -x "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-as"
          test -x "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-ld"
          ln -sf powerpc-xsdk-elf-as "$HOME/xsdk-gcc/bin/as"
          ln -sf powerpc-xsdk-elf-ld "$HOME/xsdk-gcc/bin/ld"
          export PATH="$HOME/xsdk-gcc/bin:$PATH"

          CC1_PATH="$("$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" -print-prog-name=cc1)"
          echo "CC1 encontrado em: $CC1_PATH"
          test -x "$CC1_PATH"

          echo 'int main(void) { return 0; }' | \
            "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" \
            -x c -c -o /tmp/xsdk-smoke.o -
          echo "Teste de compilação PowerPC: OK"

          echo "XSDK_ROOT=$XSDK" >> "$GITHUB_ENV"
          echo "PREFIX=$GITHUB_WORKSPACE/prefix" >> "$GITHUB_ENV"
          echo "TC=$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-" >> "$GITHUB_ENV"

          "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" --version
          test -s "$XSDK/build/libxsdk.a"
          test -s "$XSDK/src/xsdk.ld"
          test -f "$XSDK/tools/elf2xex.py"

      - name: Download pinned NetSurf dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps third_party

          clone_pin() {
            local name="$1"
            local url="$2"
            local sha="$3"
            git clone --no-checkout "$url" "deps/$name"
            git -C "deps/$name" fetch --depth 1 origin "$sha"
            git -C "deps/$name" checkout --detach FETCH_HEAD
          }

          clone_pin buildsystem https://github.com/netsurf-browser/buildsystem.git 0005ae300283ff01c2e2b05e7376b3e55dea21f7
          clone_pin libwapcaplet https://github.com/netsurf-browser/libwapcaplet.git c7c128d3eb3223b216c974471f82e9337fbcf4ba
          clone_pin libparserutils https://github.com/netsurf-browser/libparserutils.git 6b0cbf086ca8eb8fe74b69f0c9ecf274eb2397ca
          clone_pin libhubbub https://github.com/netsurf-browser/libhubbub.git 6651b8cf87a4aa87bcdb2ff024a02659cd3f9402
          clone_pin libcss https://github.com/netsurf-browser/libcss.git 006ffc4096040da13690abc380e5f828ec08284d
          clone_pin libdom https://github.com/netsurf-browser/libdom.git f69781e1f062444b5af3f62d431d7d94018da53b
          clone_pin libnsutils https://github.com/netsurf-browser/libnsutils.git 0bd39060740b6163bd50875326654a722df97eb2
          clone_pin libnspsl https://github.com/netsurf-browser/libnspsl.git 82815c2bc7fd70d1b6afccfa89a9a0f3fa73db8a
          clone_pin libnsbmp https://github.com/netsurf-browser/libnsbmp.git 3e5409942cc8a7ea7ef705b035394c6089cef4f8
          clone_pin libnsgif https://github.com/netsurf-browser/libnsgif.git 22e99eb6818b1284d0f3ff1b7f46159e87221220
          clone_pin utf8proc https://github.com/JuliaStrings/utf8proc.git f72a4023617e2d879f2ca93086fd02bc7e3149fe
          clone_pin zlib https://github.com/madler/zlib.git 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          clone_pin libpng https://github.com/pnggroup/libpng.git ed217e3e601d8e462f7fd1e04bed43ac42212429
          clone_pin nsgenbind https://github.com/netsurf-browser/nsgenbind.git 44c6736937ae17d4065d02959b82813b8f06a51e

          git clone --no-checkout https://github.com/xenosworks/mbedtls-xenon.git third_party/mbedtls-xenon
          git -C third_party/mbedtls-xenon fetch --depth 1 origin 1500b8ac2ab62f3ce6c6bebafac777e55dbee93b
          git -C third_party/mbedtls-xenon checkout --detach FETCH_HEAD
          git -C third_party/mbedtls-xenon submodule update --init --recursive

          git clone --no-checkout https://github.com/netsurf-browser/netsurf.git netsurf-src
          git -C netsurf-src fetch --depth 1 origin 39da3c3a40af4566d86500ff3052dfdc7f9a0378
          git -C netsurf-src checkout --detach FETCH_HEAD

      - name: Build host JavaScript binding generator
        run: |
          set -euo pipefail
          make -C deps/nsgenbind \
            NSSHARED="$GITHUB_WORKSPACE/deps/buildsystem" \
            PREFIX="$HOME/.local" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build zlib
        run: |
          set -euo pipefail
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          cd deps/zlib
          export CC="${TC}gcc"
          export AR="${TC}ar"
          export RANLIB="${TC}ranlib"
          export CFLAGS="-mcpu=cell -fno-pic -O2 -Wno-error"
          CHOST=powerpc-xsdk-elf ./configure --prefix="$PREFIX" --static || {
            echo "===== ERRO REAL DO ZLIB ====="
            tail -n 120 configure.log
            exit 1
          }
          make -j2 libz.a
          make install

      - name: Build JPEG
        run: |
          set -euo pipefail
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/jpeg"
          curl -L https://www.ijg.org/files/jpegsrc.v9e.tar.gz \
            -o "$RUNNER_TEMP/jpeg.tar.gz"
          tar -xzf "$RUNNER_TEMP/jpeg.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/jpeg"
          cd "$RUNNER_TEMP/jpeg"
          CC="${TC}gcc" AR="${TC}ar" RANLIB="${TC}ranlib" \
          CFLAGS="-mcpu=cell -fno-pic -O2" \
            ./configure --host=powerpc-xsdk-elf \
              --prefix="$PREFIX" --disable-shared --enable-static
          make -j2 libjpeg.la
          make install-libLTLIBRARIES install-includeHEADERS
          install -D -m 644 jconfig.h "$PREFIX/include/jconfig.h"

      - name: Build utf8proc
        run: |
          set -euo pipefail
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          make -C deps/utf8proc -j2 libutf8proc.a \
            CC="${TC}gcc" AR="${TC}ar" \
            CFLAGS="-mcpu=cell -fno-pic -O2"

          install -D -m 644 deps/utf8proc/utf8proc.h "$PREFIX/include/utf8proc.h"
          install -D -m 644 deps/utf8proc/libutf8proc.a "$PREFIX/lib/libutf8proc.a"

          mkdir -p "$PREFIX/lib/pkgconfig"
          cat > "$PREFIX/lib/pkgconfig/libutf8proc.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: libutf8proc
          Description: UTF-8 processing library
          Version: 2.10.0
          Libs: -L\${libdir} -lutf8proc
          Cflags: -I\${includedir}
          EOF

      - name: Build PNG
        run: |
          set -euo pipefail
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          cmake -S deps/libpng -B "$RUNNER_TEMP/libpng-build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$XSDK_ROOT/cmake/xsdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DPNG_SHARED=OFF \
            -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF \
            -DPNG_TOOLS=OFF \
            -DPNG_POWERPC_VSX=off \
            -DZLIB_LIBRARY="$PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$PREFIX/include"
          cmake --build "$RUNNER_TEMP/libpng-build" --parallel 2
          cmake --install "$RUNNER_TEMP/libpng-build"

      - name: Build NetSurf image libraries
        run: |
          set -euo pipefail
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          export PREFIX
          export NSSHARED="$GITHUB_WORKSPACE/deps/buildsystem"
          export CC="${TC}gcc"
          export AR="${TC}ar"
          export CFLAGS="-mcpu=cell -fno-pic -O2"

          make -C deps/libnsbmp -j2 install
          make -C deps/libnsgif -j2 install

      - name: Build core NetSurf libraries
        run: |
          set -euo pipefail
          chmod +x build_deps.sh
          ./build_deps.sh

      - name: Build mbedTLS for Xbox 360
        run: |
          set -euo pipefail
          export PATH="$HOME/xsdk-gcc/bin:$PATH"

          # Enable the Xenon clock callback used by the TLS frontend.
          sed -i '/^#undef MBEDTLS_SSL_PROTO_TLS1_3/i #define MBEDTLS_PLATFORM_TIME_ALT' \
            third_party/mbedtls-xenon/configs/config-xsdk.h

          cmake -S third_party/mbedtls-xenon \
            -B third_party/mbedtls-xenon/build-xsdk \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$XSDK_ROOT/cmake/xsdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DUSE_SHARED_MBEDTLS_LIBRARY=OFF \
            -DUSE_STATIC_MBEDTLS_LIBRARY=ON
          cmake --build third_party/mbedtls-xenon/build-xsdk --parallel 2

      - name: Prepare NetSurf Xenon frontend
        run: |
          set -euo pipefail
          git -C netsurf-src apply "$GITHUB_WORKSPACE/patches/netsurf-xenon.patch"
          cp -a frontends/xenon netsurf-src/frontends/
          cp config/Makefile.config.example netsurf-src/Makefile.config

          cat >> netsurf-src/Makefile.config <<EOF

          XENON_CC := $TC"gcc"
          XENON_CXX := $TC"g++"
          XENON_AR := $TC"ar"
          XSDK_ROOT := $XSDK_ROOT
          XENON_PREFIX := $PREFIX
          CFLAGS += -B$HOME/xsdk-gcc/bin/
          CXXFLAGS += -B$HOME/xsdk-gcc/bin/
          EOF

      - name: Compile Xenon Browser
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          make -C netsurf-src TARGET=xenon PREFIX="$PREFIX" -j2
          test -s netsurf-src/nsxenon

      - name: Convert ELF to Xbox executable
        run: |
          set -euo pipefail
          mkdir -p dist
          unzip -q release/ns360.zip -d dist

          python3 "$XSDK_ROOT/tools/elf2xex.py" \
            --title-id 0x58424E42 \
            --title-name "Xenon Browser" \
            --version 1.0.0.0 \
            netsurf-src/nsxenon \
            dist/ns360/default.xex

          test -s dist/ns360/default.xex
          sha256sum dist/ns360/default.xex

      - name: Package browser
        run: |
          set -euo pipefail
          cd dist
          zip -qr -9 xenon-browser-xbox360.zip ns360
          sha256sum xenon-browser-xbox360.zip ns360/default.xex

      - name: Upload Xenon Browser
        uses: actions/upload-artifact@v4
        with:
          name: xenon-browser-xbox360
          path: dist/xenon-browser-xbox360.zip
          if-no-files-found: error
          retention-days: 14
