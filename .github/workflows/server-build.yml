name: Build Xenon Server

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Xenon Browser
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Clone XSDK
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Build Xenon toolchain
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" \
          WORK="$HOME/xsdk-gcc-work" \
          JOBS=2 \
          bash tools/toolchain/build.sh

      - name: Build XSDK
        run: |
          cd "$HOME/xsdk"
          make -j2 TOOLCHAIN="$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-"

      - name: Configure Xenon Server
        run: |
          cmake -S server -B build-server \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc"

      - name: Compile Xenon Server
        run: |
          cmake --build build-server --verbose

      - name: Verify XEX
        run: |
          test -s build-server/XenonServer.xex
          file build-server/XenonServer.xex
          ls -lh build-server/XenonServer.xex

      - name: Upload Xbox 360 executable
        uses: actions/upload-artifact@v4
        with:
          name: XenonServer-Xbox360
          path: build-server/XenonServer.xex
          if-no-files-found: error
          retention-days: 7
